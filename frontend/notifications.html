<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <!-- ==========================================
             PAGE TITLE
        =========================================== -->

        <h1 id="notificationTitle">
            🔔 Notifications
        </h1>


        <!-- ==========================================
             NOTIFICATION LIST
        =========================================== -->

        <div
            class="form-box"
            id="notificationList"
        >

            <p>
                Loading notifications...
            </p>

        </div>


        <!-- ==========================================
             NAVIGATION BUTTONS
        =========================================== -->

        <button
            onclick="window.location.href='feedback.html'"
        >
            Submit Feedback
        </button>


        <button
            onclick="window.location.href='history.html'"
        >
            My Feedback
        </button>


        <button
            onclick="window.location.href='admin.html'"
        >
            Admin Dashboard
        </button>


        <button
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <!-- ==========================================
         NOTIFICATIONS JAVASCRIPT
    =========================================== -->

    <script src="notifications.js"></script>

</body>

</html>
